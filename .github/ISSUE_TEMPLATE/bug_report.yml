name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not post passwords, tokens or other secrets.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SonosDesk version
      description: Settings → Updates → "Installed version"
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: speakers
    attributes:
      label: Speakers and Sonos system
      placeholder: Sonos One, Beam (S2), software 27.1
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Local (UPnP, default)
        - Sonos Control API (cloud)
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt
      description: Settings → About SonosDesk → Open logs. The logs contain no tokens; remove anything you consider private.
      render: text
