name: Release

# Creates a GitHub release with the installer, the portable exe and checksums.
# Start it either by pushing a tag like "v0.2.0", or in the Actions tab with "Run workflow"
# (uses the version from Directory.Build.props unless one is entered).
# Installed copies of SonosDesk find the new release on start and show an update hint.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0). Empty = <Version> from Directory.Build.props'
        required: false
        default: ''

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
  INNO_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v', 'V')
          } elseif ($env:VERSION_INPUT) {
            $version = $env:VERSION_INPUT.Trim().TrimStart('v', 'V')
          } else {
            [xml]$props = Get-Content Directory.Build.props
            $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          }
          # Assembly versions are numeric; a suffix such as "-beta.1" marks a pre-release.
          $numeric = ($version -split '[-+]')[0]
          if ($numeric -notmatch '^\d+\.\d+\.\d+$') { throw "'$version' is not a version like 1.2.3" }
          "version=$numeric" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version -ne $numeric) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          "timestamp=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore SonosDesk.sln

      - name: Build
        run: dotnet build SonosDesk.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --solution SonosDesk.sln --configuration Release --no-build

      - name: Install Inno Setup
        shell: pwsh
        run: ./tools/install-inno-setup.ps1 -Url $env:INNO_URL -Sha256 $env:INNO_SHA256 -Destination "$env:RUNNER_TEMP\inno"

      - name: Publish and build installer
        shell: pwsh
        env:
          BuildTimestamp: ${{ steps.version.outputs.timestamp }}
        run: ./tools/build-installer.ps1 -Version ${{ steps.version.outputs.version }} -Iscc "$env:RUNNER_TEMP\inno\ISCC.exe"

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setup = "artifacts/installer/SonosDesk-Setup-$version-win-x64.exe"
          $portable = "artifacts/SonosDesk-$version-win-x64-portable.exe"
          $zip = "artifacts/SonosDesk-$version-win-x64-portable.zip"
          Copy-Item artifacts/SonosDesk-win-x64/SonosDesk.exe $portable
          Copy-Item LICENSE, README.md, THIRD-PARTY-NOTICES.md artifacts/SonosDesk-win-x64/
          Compress-Archive -Path artifacts/SonosDesk-win-x64/* -DestinationPath $zip
          Get-FileHash $setup, $portable, $zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content artifacts/SHA256SUMS.txt -Encoding utf8

          # Release notes: the section of this version in CHANGELOG.md.
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [Array]::FindIndex($lines, [Predicate[string]] { param($l) $l -match "^## \[?v?$([regex]::Escape($version))\]?" })
          if ($start -ge 0) {
            $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]] { param($l) $l -match '^## ' })
            if ($end -lt 0) { $end = $lines.Length }
            $lines[($start + 1)..($end - 1)] | Set-Content artifacts/release-notes.md -Encoding utf8
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $files = @(
            "artifacts/installer/SonosDesk-Setup-$version-win-x64.exe",
            "artifacts/SonosDesk-$version-win-x64-portable.exe",
            "artifacts/SonosDesk-$version-win-x64-portable.zip",
            'artifacts/SHA256SUMS.txt')
          $flags = @('--title', "SonosDesk $tag", '--target', $env:GITHUB_SHA)
          if (Test-Path artifacts/release-notes.md) { $flags += @('--notes-file', 'artifacts/release-notes.md') } else { $flags += '--generate-notes' }
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $tag @files @flags
